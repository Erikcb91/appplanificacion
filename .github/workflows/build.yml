name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Static Keystore (Firma fija para actualizaciones)
        run: |
          keytool -genkeypair -v -keystore my-release-key.jks -alias myalias -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=Erik, OU=Personal, O=App, L=Burgos, S=Burgos, C=ES"

      - name: Inject Signing Config into Gradle
        run: |
          sed -i '/android {/a \
              signingConfigs {\
                  debug {\
                      storeFile file("../../my-release-key.jks")\
                      storePassword "password123"\
                      keyAlias "myalias"\
                      keyPassword "password123"\
                  }\
              }\
              buildTypes {\
                  debug {\
                      signingConfig signingConfigs.debug\
                  }\
              }' android/app/build.gradle

      - name: Sync web code
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
