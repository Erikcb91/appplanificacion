name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Versión creciente (necesaria para poder actualizar encima)
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle

      - name: Instalar widget nativo de Android
        run: |
          APP=android/app/src/main
          mkdir -p $APP/java/com/erik/rutas
          cp android-native/java/*.java $APP/java/com/erik/rutas/
          cp -r android-native/res/. $APP/res/
          python3 android-native/patch_manifest.py $APP/AndroidManifest.xml

      - name: Restaurar firma fija (desde el Secret KEYSTORE_BASE64)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret KEYSTORE_BASE64. Sin una firma fija Android no deja actualizar la app encima de la anterior. Créalo en Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > my-release-key.jks
          keytool -list -keystore my-release-key.jks -storepass password123 -alias myalias

      - name: Inject Signing Config into Gradle
        run: |
          sed -i '/android {/a \
              signingConfigs {\
                  debug {\
                      storeFile file("../../my-release-key.jks")\
                      storePassword "password123"\
                      keyAlias "myalias"\
                      keyPassword "password123"\
                  }\
              }\
              buildTypes {\
                  debug {\
                      signingConfig signingConfigs.debug\
                  }\
              }' android/app/build.gradle

      - name: Sync web code
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
